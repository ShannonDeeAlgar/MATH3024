<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Choreographed and spontaneous synchronisation</title>
  <desc id="desc">On the left, swimmers follow shared cues and a planned sequence. On the right, oscillators keep individual clocks and influence one another without a leader.</desc>
  <defs>
    <marker id="cue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#D95F3B"/></marker>
    <marker id="local-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#4A90C2"/></marker>
  </defs>
  <rect x="5" y="5" width="1190" height="490" rx="18" fill="#FAFBFE" stroke="#CBD6E7" stroke-width="2"/>
  <line x1="600" y1="35" x2="600" y2="465" stroke="#CBD6E7" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#192B52">
    <text x="300" y="55" text-anchor="middle" font-size="30">Choreographed coordination</text>
    <text x="900" y="55" text-anchor="middle" font-size="30">Spontaneous synchronisation</text>

    <circle cx="300" cy="150" r="31" fill="#D95F3B"/><text x="300" y="158" text-anchor="middle" font-size="22" fill="#FFFFFF">cue</text>
    <g fill="#4A90C2" stroke="#192B52" stroke-width="3">
      <circle cx="145" cy="290" r="25"/><circle cx="245" cy="335" r="25"/><circle cx="355" cy="335" r="25"/><circle cx="455" cy="290" r="25"/>
    </g>
    <g fill="none" stroke="#D95F3B" stroke-width="4" marker-end="url(#cue-arrow)">
      <path d="M282 177 Q210 220 158 261"/><path d="M292 181 Q270 245 250 303"/><path d="M308 181 Q330 245 350 303"/><path d="M318 177 Q390 220 442 261"/>
    </g>
    <text x="300" y="406" text-anchor="middle" font-size="23">shared score, rehearsal or leader</text>
    <text x="300" y="440" text-anchor="middle" font-size="23">timing organised from the top down</text>

    <g fill="#4A90C2" stroke="#192B52" stroke-width="3">
      <circle cx="755" cy="205" r="27"/><circle cx="850" cy="160" r="27"/><circle cx="950" cy="195" r="27"/><circle cx="1020" cy="285" r="27"/><circle cx="910" cy="330" r="27"/><circle cx="790" cy="300" r="27"/>
    </g>
    <g fill="none" stroke="#4A90C2" stroke-width="3" marker-end="url(#local-arrow)" opacity="0.9">
      <path d="M782 194 Q805 172 822 168"/><path d="M878 166 Q910 168 923 182"/><path d="M972 215 Q1000 235 1010 257"/><path d="M999 302 Q960 323 937 326"/><path d="M883 326 Q835 320 814 307"/><path d="M774 278 Q752 243 753 232"/>
    </g>
    <g stroke="#D95F3B" stroke-width="5">
      <line x1="755" y1="205" x2="755" y2="170"/><line x1="850" y1="160" x2="872" y2="135"/><line x1="950" y1="195" x2="979" y2="181"/>
      <line x1="1020" y1="285" x2="1024" y2="250"/><line x1="910" y1="330" x2="932" y2="303"/><line x1="790" y1="300" x2="815" y2="277"/>
    </g>
    <text x="900" y="406" text-anchor="middle" font-size="23">each component retains its own clock</text>
    <text x="900" y="440" text-anchor="middle" font-size="23">coordination emerges through interaction</text>
  </g>
</svg>
