<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Natural frequencies assigned to the Kuramoto oscillators</title>
  <desc id="desc">A histogram centred at angular frequency three with standard deviation zero point six five.</desc>
  <rect width="900" height="500" fill="white"/>
  <g stroke="#d9e1ee" stroke-width="2">
    <path d="M105 375H850M105 285H850M105 195H850M105 105H850"/>
  </g>
  <g fill="#2c7fb8" fill-opacity="0.82" stroke="white" stroke-width="2">
    <rect x="125" y="348" width="38" height="27"/><rect x="163" y="330" width="38" height="45"/>
    <rect x="201" y="303" width="38" height="72"/><rect x="239" y="267" width="38" height="108"/>
    <rect x="277" y="222" width="38" height="153"/><rect x="315" y="168" width="38" height="207"/>
    <rect x="353" y="123" width="38" height="252"/><rect x="391" y="87" width="38" height="288"/>
    <rect x="429" y="69" width="38" height="306"/><rect x="467" y="78" width="38" height="297"/>
    <rect x="505" y="105" width="38" height="270"/><rect x="543" y="150" width="38" height="225"/>
    <rect x="581" y="204" width="38" height="171"/><rect x="619" y="249" width="38" height="126"/>
    <rect x="657" y="294" width="38" height="81"/><rect x="695" y="330" width="38" height="45"/>
    <rect x="733" y="348" width="38" height="27"/><rect x="771" y="357" width="38" height="18"/>
  </g>
  <g fill="none" stroke="#192b52" stroke-width="4"><path d="M105 70V375H850"/></g>
  <g fill="#192b52" font-family="Arial, sans-serif">
    <text x="477" y="42" text-anchor="middle" font-size="27">Natural-frequency distribution</text>
    <text x="477" y="455" text-anchor="middle" font-size="24">natural frequency, ωᵢ</text>
    <text x="30" y="225" transform="rotate(-90 30 225)" text-anchor="middle" font-size="24">number of oscillators</text>
    <g font-size="20" text-anchor="middle"><text x="201" y="410">1.5</text><text x="353" y="410">2.5</text><text x="467" y="410">3.0</text><text x="581" y="410">3.5</text><text x="733" y="410">4.5</text></g>
  </g>
</svg>
