<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --ink:#1b2a4c; --blue:#2c7fb8; --orange:#d95f3b; --yellow:#f4c542; --grid:#d7dfed; --muted:#5a6685; }
  * { box-sizing:border-box; }
  body { margin:0; background:white; color:var(--ink); font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .tool { max-width:1120px; margin:auto; padding:10px 16px 6px; }
  .controls { display:grid; grid-template-columns:auto minmax(180px,1fr) auto auto minmax(180px,1fr) auto; gap:12px; align-items:center; margin-bottom:8px; }
  button { border:1px solid var(--ink); border-radius:6px; background:var(--ink); color:white; padding:7px 16px; font:inherit; cursor:pointer; }
  label { font-weight:600; white-space:nowrap; }
  input[type=range] { width:100%; accent-color:var(--blue); }
  output { min-width:62px; font-variant-numeric:tabular-nums; }
  canvas { display:block; width:100%; height:auto; border-top:1px solid var(--grid); }
  .note { display:flex; justify-content:space-between; gap:20px; color:var(--muted); font-size:14px; margin-top:3px; }
  @media (max-width:720px) {
    .controls { grid-template-columns:auto 1fr auto; }
    .controls label:nth-of-type(2) { grid-column:1; }
    .controls input:nth-of-type(2) { grid-column:2; }
  }
</style>
</head>
<body>
<div class="tool">
  <div class="controls">
    <button id="play" type="button">Play</button>
    <input id="time" type="range" min="0" max="200" step="1" value="0" aria-label="Simulation time">
    <output id="timeOut">t = 0.0</output>
    <label for="coupling">Coupling, <i>K</i></label>
    <input id="coupling" type="range" min="0" max="3.5" step="0.05" value="1.20">
    <output id="kOut">K = 1.20</output>
  </div>
  <canvas id="view" width="1120" height="390" aria-label="Kuramoto phase-circle and fixed-node flashing views"></canvas>
  <div class="note"><span>Left: position in the oscillation cycle</span><span>Right: fixed nodes flash on completing a cycle</span></div>
</div>
<script>
(() => {
  const N=36, dt=0.02, frameDt=0.10, duration=20, frames=Math.round(duration/frameDt);
  const ink='#1b2a4c', blue='#2c7fb8', orange='#d95f3b', yellow='#f4c542', grid='#d7dfed';
  const canvas=document.getElementById('view'), ctx=canvas.getContext('2d');
  const time=document.getElementById('time'), coupling=document.getElementById('coupling');
  const timeOut=document.getElementById('timeOut'), kOut=document.getElementById('kOut'), play=document.getElementById('play');
  time.max=frames;
  let timer=null, history=[];

  function rng(seed){ return () => { seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function normal(random){ const u=Math.max(random(),1e-12),v=random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  const random=rng(3024), omega=[], initial=[];
  for(let i=0;i<N;i++){ omega.push(3+0.55*normal(random)); initial.push(2*Math.PI*random()); }

  function simulate(){
    const K=+coupling.value, theta=initial.slice(); history=[];
    const stride=Math.round(frameDt/dt), steps=Math.round(duration/dt);
    for(let n=0;n<=steps;n++){
      if(n%stride===0) history.push(theta.slice());
      let cx=0,sy=0;
      for(const q of theta){ cx+=Math.cos(q); sy+=Math.sin(q); }
      cx/=N; sy/=N;
      for(let i=0;i<N;i++) theta[i]=(theta[i]+dt*(omega[i]+K*(sy*Math.cos(theta[i])-cx*Math.sin(theta[i])))+2*Math.PI)%(2*Math.PI);
    }
    time.value=0; draw();
  }
  function circlePoint(cx,cy,r,a){ return [cx+r*Math.cos(a),cy-r*Math.sin(a)]; }
  function draw(){
    const f=+time.value, theta=history[f], t=f*frameDt;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle=ink; ctx.font='600 24px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Position in the cycle',285,32); ctx.fillText('Fixed nodes that flash',835,32);
    const cx=285,cy=205,r=135;
    ctx.strokeStyle=ink; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI); ctx.stroke();
    let zx=0,zy=0;
    theta.forEach((a,i)=>{
      const [x,y]=circlePoint(cx,cy,r,a); zx+=Math.cos(a); zy+=Math.sin(a);
      const z=(omega[i]-2.0)/2.0, red=Math.round(44+173*Math.max(0,Math.min(1,z))), blu=Math.round(184-125*Math.max(0,Math.min(1,z)));
      ctx.fillStyle=`rgb(${red},105,${blu})`; ctx.strokeStyle='white'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(x,y,7,0,2*Math.PI); ctx.fill(); ctx.stroke();
    });
    zx/=N; zy/=N; ctx.strokeStyle=orange; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+r*zx,cy-r*zy); ctx.stroke();
    const startX=690,startY=70,dx=58,dy=48;
    theta.forEach((a,i)=>{
      const row=Math.floor(i/6),col=i%6,x=startX+col*dx,y=startY+row*dy;
      const distance=Math.min(a,2*Math.PI-a), flash=Math.exp(-0.5*(distance/0.20)**2);
      ctx.fillStyle=flash>0.12?`rgba(244,197,66,${0.18+0.82*flash})`:'#eef1f6';
      ctx.strokeStyle=ink; ctx.lineWidth=1.7; ctx.beginPath(); ctx.arc(x,y,17,0,2*Math.PI); ctx.fill(); ctx.stroke();
    });
    const coherence=Math.hypot(zx,zy);
    ctx.fillStyle=ink; ctx.font='18px sans-serif'; ctx.textAlign='left';
    ctx.fillText(`coherence r = ${coherence.toFixed(2)}`,205,378);
    ctx.fillText(`simulation time t = ${t.toFixed(1)}`,745,378);
    timeOut.value=`t = ${t.toFixed(1)}`; kOut.value=`K = ${(+coupling.value).toFixed(2)}`;
  }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  play.addEventListener('click',()=>{
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(()=>{ let f=+time.value; if(f>=frames){ stop(); return; } time.value=f+1; draw(); },80);
  });
  time.addEventListener('input',()=>{ stop(); draw(); });
  coupling.addEventListener('input',()=>{ stop(); simulate(); });
  simulate();
})();
</script>
</body>
</html>
