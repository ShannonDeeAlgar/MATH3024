<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="80 55 520 430" role="img" aria-labelledby="title desc">
  <title id="title">Two phase oscillators on a phase circle</title>
  <desc id="desc">Two coloured oscillator markers lie on a shared phase circle. Short curved arrows outside the circle show their angular motion. Radii show their phases and a dashed arc shows their phase difference.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4A90C2"/></marker>
    <marker id="orange-arrow" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#D95F3B"/></marker>
  </defs>
  <circle cx="385" cy="292" r="165" fill="none" stroke="#1B2E55" stroke-width="7"/>
  <line x1="385" y1="292" x2="519" y2="196" stroke="#D95F3B" stroke-width="5"/>
  <line x1="385" y1="292" x2="282" y2="163" stroke="#4A90C2" stroke-width="5"/>
  <path d="M438 254 A65 65 0 0 0 347 244" fill="none" stroke="#7A8BA9" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="519" cy="196" r="25" fill="#D95F3B" stroke="#1B2E55" stroke-width="4"/>
  <circle cx="282" cy="163" r="25" fill="#4A90C2" stroke="#1B2E55" stroke-width="4"/>
  <!-- Short tangential arcs outside the phase circle; they do not collide with the markers. -->
  <path d="M565 215 C571 191 565 166 548 145" fill="none" stroke="#D95F3B" stroke-width="5" stroke-linecap="round" marker-end="url(#orange-arrow)"/>
  <path d="M251 112 C227 124 211 148 207 176" fill="none" stroke="#4A90C2" stroke-width="5" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-style="italic">
    <text x="469" y="257" font-size="30" fill="#D95F3B">θ₁</text>
    <text x="308" y="248" font-size="30" fill="#4A90C2">θ₂</text>
    <text x="385" y="218" text-anchor="middle" font-size="27" fill="#586A8D">φ = θ₁ − θ₂</text>
    <text x="576" y="151" font-size="29" fill="#D95F3B">ω₁</text>
    <text x="173" y="119" font-size="29" fill="#4A90C2">ω₂</text>
  </g>
</svg>
