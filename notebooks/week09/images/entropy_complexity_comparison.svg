<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Schematic comparison of entropy and structural complexity</title>
  <desc id="desc">Entropy rises from order to randomness, while structural complexity is low at both extremes and higher for structured organisation between them.</desc>
  <rect width="1200" height="430" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17284f">
    <line x1="105" y1="332" x2="1125" y2="332" stroke="#17284f" stroke-width="3"/>
    <path d="M1110 323 L1125 332 L1110 341" fill="none" stroke="#17284f" stroke-width="3"/>
    <line x1="105" y1="332" x2="105" y2="58" stroke="#17284f" stroke-width="3"/>
    <path d="M96 73 L105 58 L114 73" fill="none" stroke="#17284f" stroke-width="3"/>

    <path d="M145 305 C330 300 405 92 600 82 C795 92 870 300 1085 305"
          fill="none" stroke="#2f78ad" stroke-width="8" stroke-linecap="round"/>
    <path d="M145 305 C380 286 760 176 1085 82"
          fill="none" stroke="#d95f3d" stroke-width="7" stroke-linecap="round"/>

    <text x="56" y="202" transform="rotate(-90 56 202)" font-size="25" text-anchor="middle">relative value</text>
    <text x="615" y="405" font-size="28" text-anchor="middle">from order to randomness for a fixed description</text>

    <text x="540" y="47" font-size="27" text-anchor="middle" fill="#2f78ad">structural complexity</text>
    <text x="1000" y="61" font-size="27" text-anchor="middle" fill="#d95f3d">entropy</text>

    <text x="160" y="365" font-size="22" text-anchor="middle" fill="#52627f">perfect order</text>
    <text x="1040" y="365" font-size="22" text-anchor="middle" fill="#52627f">perfect randomness</text>
  </g>
</svg>
