<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Joint, conditional and mutual information</title>
  <desc id="desc">Two overlapping circles show the entropy unique to X, the entropy unique to Y, and their mutual information.</desc>
  <rect width="760" height="390" fill="white"/>
  <circle cx="300" cy="195" r="165" fill="#8CB9D8" fill-opacity="0.82" stroke="#172A50" stroke-width="4"/>
  <circle cx="460" cy="195" r="165" fill="#F4C542" fill-opacity="0.72" stroke="#172A50" stroke-width="4"/>
  <g fill="#172A50" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="230" y="92" font-size="34" font-style="italic">H(X)</text>
    <text x="530" y="92" font-size="34" font-style="italic">H(Y)</text>
    <text x="235" y="230" font-size="28" font-style="italic">H(X | Y)</text>
    <text x="380" y="205" font-size="30" font-style="italic">I(X; Y)</text>
    <text x="525" y="230" font-size="28" font-style="italic">H(Y | X)</text>
  </g>
</svg>
