<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#172a50;--blue:#3978a8;--grid:#dbe3ef;--muted:#5a6a82}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;color:var(--ink);margin:0;padding:18px;background:#fff}.wrap{display:grid;grid-template-columns:minmax(265px,.75fr) minmax(420px,1.25fr);gap:26px;align-items:start}h2{font-size:1.25rem;margin:0 0 12px}label{font-weight:650}.select{display:grid;gap:6px;margin-bottom:16px}select{font:inherit;padding:8px;border:1px solid #aebbd0;border-radius:5px;background:white;color:var(--ink)}.row{display:grid;grid-template-columns:92px 1fr 58px;gap:10px;align-items:center;margin:14px 0}input{width:100%}.value{font-variant-numeric:tabular-nums;text-align:right}.entropy{font-size:1.25rem;font-weight:750;margin-top:17px}.formula{font-family:Georgia,serif;font-size:1.05rem;margin-top:8px}.note{font-size:.88rem;color:var(--muted);line-height:1.4;margin-top:12px}svg{width:100%;height:355px;display:block}.axis{stroke:var(--ink);stroke-width:2}.grid{stroke:var(--grid);stroke-width:1}.curve{fill:none;stroke:var(--blue);stroke-width:4}.area{fill:#3978a829}.bar{fill:var(--blue)}.tick{font:13px system-ui;fill:var(--muted)}.axislabel{font:15px system-ui;fill:var(--ink)}@media(max-width:760px){.wrap{grid-template-columns:1fr}svg{height:280px}}
</style></head><body><div class="wrap"><section><h2>Choose a distribution</h2><div class="select"><label for="family">Distribution</label><select id="family"></select></div><div id="controls"></div><div class="entropy" id="entropy"></div><div class="formula" id="formula"></div><div class="note" id="note"></div></section><section><svg id="plot" viewBox="0 0 720 390" role="img" aria-label="Selected probability distribution"></svg></section></div>
<script>
const families={
bernoulli:{label:'Bernoulli(p)',kind:'discrete',pars:[['p',.5,.01,.99,.01]],support:p=>[0,1],pmf:(x,p)=>x?p.p:1-p.p,H:p=>binaryH(p.p),formula:'H = −p log₂p − (1−p) log₂(1−p)'},
binomial:{label:'Binomial(n, p)',kind:'discrete',pars:[['n',10,1,30,1],['p',.5,.01,.99,.01]],support:p=>range(0,p.n),pmf:(k,p)=>choose(p.n,k)*p.p**k*(1-p.p)**(p.n-k),H:p=>entropyDiscrete(range(0,p.n).map(k=>choose(p.n,k)*p.p**k*(1-p.p)**(p.n-k))),formula:'H = −Σₖ P(k) log₂P(k)'},
poisson:{label:'Poisson(λ)',kind:'discrete',pars:[['λ',4,.2,15,.1]],support:p=>range(0,Math.ceil(p.λ+5*Math.sqrt(p.λ))),pmf:(k,p)=>Math.exp(-p.λ)*p.λ**k/fact(k),H:p=>entropyDiscrete(range(0,Math.ceil(p.λ+8*Math.sqrt(p.λ))).map(k=>Math.exp(-p.λ)*p.λ**k/fact(k))),formula:'H = −Σₖ P(k) log₂P(k)'},
geometric:{label:'Geometric(p)',kind:'discrete',pars:[['p',.35,.05,.95,.01]],support:p=>range(1,Math.min(40,Math.ceil(Math.log(.005)/Math.log(1-p.p)))),pmf:(k,p)=>p.p*(1-p.p)**(k-1),H:p=>-(Math.log2(p.p)+(1-p.p)/p.p*Math.log2(1-p.p)),formula:'H = −log₂p − [(1−p)/p] log₂(1−p)'},
normal:{label:'Normal(μ, σ)',kind:'continuous',pars:[['μ',0,-4,4,.1],['σ',1,.15,3,.05]],domain:p=>[p.μ-4*p.σ,p.μ+4*p.σ],pdf:(x,p)=>Math.exp(-.5*((x-p.μ)/p.σ)**2)/(p.σ*Math.sqrt(2*Math.PI)),H:p=>.5*Math.log2(2*Math.PI*Math.E*p.σ*p.σ),formula:'h = ½ log₂(2πeσ²)'},
exponential:{label:'Exponential(λ)',kind:'continuous',pars:[['λ',1,.15,4,.05]],domain:p=>[0,7/p.λ],pdf:(x,p)=>p.λ*Math.exp(-p.λ*x),H:p=>(1-Math.log(p.λ))/Math.log(2),formula:'h = (1 − ln λ)/ln 2'},
uniform:{label:'Uniform(a, width)',kind:'continuous',pars:[['a',0,-4,3,.1],['width',2,.1,8,.1]],domain:p=>[p.a-.1*p.width,p.a+1.1*p.width],pdf:(x,p)=>(x>=p.a&&x<=p.a+p.width)?1/p.width:0,H:p=>Math.log2(p.width),formula:'h = log₂(width)'},
beta:{label:'Beta(α, β)',kind:'continuous',pars:[['α',2,.2,8,.1],['β',2,.2,8,.1]],domain:p=>[.001,.999],pdf:(x,p)=>x**(p.α-1)*(1-x)**(p.β-1)/beta(p.α,p.β),H:p=>(logGamma(p.α)+logGamma(p.β)-logGamma(p.α+p.β)-(p.α-1)*digamma(p.α)-(p.β-1)*digamma(p.β)+(p.α+p.β-2)*digamma(p.α+p.β))/Math.log(2),formula:'h = log₂B(α,β) − …'}
};
const select=document.getElementById('family'),controls=document.getElementById('controls'),plot=document.getElementById('plot');Object.entries(families).forEach(([k,v])=>select.insertAdjacentHTML('beforeend',`<option value="${k}">${v.label}</option>`));
function range(a,b){return Array.from({length:b-a+1},(_,i)=>a+i)}function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r}function choose(n,k){let r=1;for(let i=1;i<=k;i++)r*=(n-k+i)/i;return r}function binaryH(p){return-p*Math.log2(p)-(1-p)*Math.log2(1-p)}function entropyDiscrete(ps){return-ps.reduce((s,p)=>s+(p>0?p*Math.log2(p):0),0)}
function logGamma(z){const c=[.9999999999998099,676.5203681218851,-1259.1392167224028,771.3234287776531,-176.6150291621406,12.5073432786869,-.13857109526572,9.9843695780196e-6,1.5056327351493116e-7];if(z<.5)return Math.log(Math.PI)-Math.log(Math.sin(Math.PI*z))-logGamma(1-z);z--;let x=c[0];for(let i=1;i<c.length;i++)x+=c[i]/(z+i);let t=z+7.5;return .5*Math.log(2*Math.PI)+(z+.5)*Math.log(t)-t+Math.log(x)}function beta(a,b){return Math.exp(logGamma(a)+logGamma(b)-logGamma(a+b))}function digamma(x){let r=0;while(x<7){r-=1/x;x++}let f=1/(x*x);return r+Math.log(x)-1/(2*x)-f*(1/12-f*(1/120-f/252))}
function params(f){let p={};f.pars.forEach(([n])=>p[n]=+document.getElementById('p_'+n).value);return p}function setup(){const f=families[select.value];controls.innerHTML='';f.pars.forEach(([n,d,min,max,step])=>controls.insertAdjacentHTML('beforeend',`<div class="row"><label for="p_${n}">${n}</label><input id="p_${n}" type="range" min="${min}" max="${max}" step="${step}" value="${d}"><span class="value" id="v_${n}"></span></div>`));controls.querySelectorAll('input').forEach(x=>x.addEventListener('input',update));update()}function svg(tag,attrs){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e}
function update(){const f=families[select.value],p=params(f);f.pars.forEach(([n])=>document.getElementById('v_'+n).textContent=p[n].toFixed(n==='n'?0:2));document.getElementById('entropy').textContent=(f.kind==='discrete'?'Shannon entropy H = ':'Differential entropy h = ')+f.H(p).toFixed(3)+' bits';document.getElementById('formula').textContent=f.formula;document.getElementById('note').textContent=f.kind==='discrete'?'Bar heights are probabilities and sum to one. Shannon entropy is non-negative.':'The curve is a probability density, not a probability at one point. Differential entropy depends on units and may be negative; do not compare it directly with discrete Shannon entropy.';draw(f,p)}
function draw(f,p){plot.innerHTML='';const L=58,R=695,T=22,B=330,W=R-L,H=B-T;[0,.25,.5,.75,1].forEach(q=>{let y=B-q*H;plot.append(svg('line',{x1:L,y1:y,x2:R,y2:y,class:'grid'}))});plot.append(svg('line',{x1:L,y1:T,x2:L,y2:B,class:'axis'}));plot.append(svg('line',{x1:L,y1:B,x2:R,y2:B,class:'axis'}));let xs,ys;if(f.kind==='discrete'){xs=f.support(p);ys=xs.map(x=>f.pmf(x,p));let ymax=Math.max(...ys)*1.08,bw=Math.min(44,(W/xs.length)*.72);xs.forEach((x,i)=>{let cx=L+(i+.5)*W/xs.length,y=B-ys[i]/ymax*H;plot.append(svg('rect',{x:cx-bw/2,y,width:bw,height:B-y,class:'bar'}));if(xs.length<=16||i%Math.ceil(xs.length/12)===0){let t=svg('text',{x:cx,y:B+20,class:'tick','text-anchor':'middle'});t.textContent=x;plot.append(t)}})}else{let[xmin,xmax]=f.domain(p);xs=range(0,220).map(i=>xmin+(xmax-xmin)*i/220);ys=xs.map(x=>f.pdf(x,p));let ymax=Math.max(...ys)*1.08,pts=xs.map((x,i)=>[L+i*W/(xs.length-1),B-ys[i]/ymax*H]);plot.append(svg('path',{d:`M ${L} ${B} `+pts.map(q=>`L ${q[0]} ${q[1]}`).join(' ')+` L ${R} ${B} Z`,class:'area'}));plot.append(svg('path',{d:pts.map((q,i)=>(i?'L':'M')+` ${q[0]} ${q[1]}`).join(' '),class:'curve'}));[0,.25,.5,.75,1].forEach(q=>{let t=svg('text',{x:L+q*W,y:B+20,class:'tick','text-anchor':'middle'});t.textContent=(xmin+q*(xmax-xmin)).toFixed(2);plot.append(t)})}let yl=svg('text',{x:18,y:180,class:'axislabel',transform:'rotate(-90 18 180)','text-anchor':'middle'});yl.textContent=f.kind==='discrete'?'probability':'density';plot.append(yl)}select.addEventListener('change',setup);setup();
</script></body></html>
