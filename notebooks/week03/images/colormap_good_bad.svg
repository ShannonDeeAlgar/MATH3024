  <line x1="28" y1="256" x2="892" y2="256" stroke="#c7cedc" stroke-width="2"/>
  <text x="28" y="343" class="t">rainbow</text><rect x="150" y="319" width="720" height="34" rx="3" fill="url(#rainbow)"/>
