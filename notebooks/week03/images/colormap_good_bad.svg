<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
  <defs>
    <style>
      .h{font:700 27px Arial,sans-serif;fill:#1b2a4c}.t{font:21px Arial,sans-serif;fill:#1b2a4c}.s{font:17px Arial,sans-serif;fill:#5a6685}
    </style>
    <linearGradient id="viridis"><stop stop-color="#440154"/><stop offset=".25" stop-color="#3b528b"/><stop offset=".5" stop-color="#21918c"/><stop offset=".75" stop-color="#5ec962"/><stop offset="1" stop-color="#fde725"/></linearGradient>
    <linearGradient id="cividis"><stop stop-color="#00204c"/><stop offset=".25" stop-color="#414d6b"/><stop offset=".5" stop-color="#7d7c78"/><stop offset=".75" stop-color="#bcae6c"/><stop offset="1" stop-color="#fee838"/></linearGradient>
    <linearGradient id="plasma"><stop stop-color="#0d0887"/><stop offset=".25" stop-color="#7e03a8"/><stop offset=".5" stop-color="#cc4778"/><stop offset=".75" stop-color="#f89540"/><stop offset="1" stop-color="#f0f921"/></linearGradient>
    <linearGradient id="rainbow"><stop stop-color="#0000ff"/><stop offset=".2" stop-color="#00ffff"/><stop offset=".4" stop-color="#00ff00"/><stop offset=".6" stop-color="#ffff00"/><stop offset=".8" stop-color="#ff7f00"/><stop offset="1" stop-color="#ff0000"/></linearGradient>
