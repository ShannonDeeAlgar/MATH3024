<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #17284d; }
.title { font-size: 28px; font-weight: 700; }
.label { font-size: 22px; font-weight: 700; }
.body { font-size: 18px; }
.small { font-size: 15px; fill: #52627f; }
.panel { fill: none; stroke: #bcc8dc; stroke-width: 2; }
.navy { stroke: #17284d; fill: none; stroke-width: 5; }
.blue { stroke: #5d7fae; fill: none; stroke-width: 5; }
.yellow { stroke: #efc94c; fill: none; stroke-width: 5; }
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#efc94c"/></marker></defs><text x="600" y="38" text-anchor="middle" class="title">Turing’s six linear outcomes</text><rect x="35" y="70" width="355" height="240" rx="12" class="panel"/><text x="53" y="104" class="label">(a) Long-wave stationary</text><text x="53" y="288" class="small">broad drift</text><path d="M70 225 C155 150,280 150,355 225" class="navy"/><rect x="420" y="70" width="355" height="240" rx="12" class="panel"/><text x="438" y="104" class="label">(b) Long-wave oscillation</text><text x="438" y="288" class="small">whole field pulses</text><path d="M455 195 C515 125,575 265,635 195 S720 125,745 195" class="blue"/><rect x="805" y="70" width="355" height="240" rx="12" class="panel"/><text x="823" y="104" class="label">(c) Shortest-wave stationary</text><text x="823" y="288" class="small">neighbours alternate</text><rect x="840" y="155" width="29" height="82" fill="#17284d"/><rect x="869" y="155" width="29" height="82" fill="#efc94c"/><rect x="898" y="155" width="29" height="82" fill="#17284d"/><rect x="927" y="155" width="29" height="82" fill="#efc94c"/><rect x="956" y="155" width="29" height="82" fill="#17284d"/><rect x="985" y="155" width="29" height="82" fill="#efc94c"/><rect x="1014" y="155" width="29" height="82" fill="#17284d"/><rect x="1043" y="155" width="29" height="82" fill="#efc94c"/><rect x="1072" y="155" width="29" height="82" fill="#17284d"/><rect x="1101" y="155" width="29" height="82" fill="#efc94c"/><rect x="35" y="355" width="355" height="240" rx="12" class="panel"/><text x="53" y="389" class="label">(d) Finite-wave stationary</text><text x="53" y="573" class="small">fixed spacing</text><path d="M63 490 C100 420,137 420,174 490 S248 560,285 490 S339 420,362 490" class="navy"/><rect x="420" y="355" width="355" height="240" rx="12" class="panel"/><text x="438" y="389" class="label">(e) Finite-wave travelling</text><text x="438" y="573" class="small">pattern moves</text><path d="M455 505 C500 425,545 425,590 505 S680 585,735 505" class="blue"/><path d="M525 425 L665 425" stroke="#efc94c" stroke-width="5" marker-end="url(#a)"/><rect x="805" y="355" width="355" height="240" rx="12" class="panel"/><text x="823" y="389" class="label">(f) Shortest-wave oscillation</text><text x="823" y="573" class="small">neighbours alternate in time</text><circle cx="853" cy="480" r="11" fill="#5d7fae"/><circle cx="882" cy="480" r="22" fill="#17284d"/><circle cx="911" cy="480" r="11" fill="#5d7fae"/><circle cx="940" cy="480" r="22" fill="#17284d"/><circle cx="969" cy="480" r="11" fill="#5d7fae"/><circle cx="998" cy="480" r="22" fill="#17284d"/><circle cx="1027" cy="480" r="11" fill="#5d7fae"/><circle cx="1056" cy="480" r="22" fill="#17284d"/><circle cx="1085" cy="480" r="11" fill="#5d7fae"/><circle cx="1114" cy="480" r="22" fill="#17284d"/>
</svg>