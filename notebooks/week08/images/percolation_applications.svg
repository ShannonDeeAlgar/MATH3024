<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">Applications of percolation</title>
  <desc id="desc">Four panels illustrate coffee extraction, network connectivity, epidemic reach, and fire spread as local connections producing system-wide outcomes.</desc>
  <defs>
    <style>
      .panel{fill:#f7f9fc;stroke:#cbd5e5;stroke-width:3}.label{font:600 25px Arial,sans-serif;fill:#182c55;text-anchor:middle}.small{font:19px Arial,sans-serif;fill:#536887;text-anchor:middle}.link{stroke:#7890b5;stroke-width:7;stroke-linecap:round}.node{fill:#fff;stroke:#182c55;stroke-width:4}.active{fill:#df5a36;stroke:#b53d22;stroke-width:3}.gold{fill:#f2c84b}.dark{fill:#503225}.pore{fill:#fff;stroke:#d8c1a9;stroke-width:2}.flow{fill:none;stroke:#2f83b9;stroke-width:7;stroke-linecap:round}.tree{stroke:#755033;stroke-width:5;stroke-linecap:round}.crown{fill:#739966}.flame{fill:#df5a36}.flame2{fill:#f2c84b}
    </style>
  </defs>

  <rect class="panel" x="10" y="10" width="330" height="300" rx="18"/>
  <text class="label" x="175" y="50">Coffee extraction</text>
  <path d="M72 82h206l-24 154H96z" fill="#e9ddce" stroke="#182c55" stroke-width="4"/>
  <g class="dark">
    <circle cx="102" cy="111" r="18"/><circle cx="148" cy="104" r="19"/><circle cx="197" cy="112" r="20"/><circle cx="248" cy="103" r="18"/>
    <circle cx="122" cy="151" r="20"/><circle cx="175" cy="154" r="18"/><circle cx="228" cy="145" r="20"/>
    <circle cx="101" cy="194" r="17"/><circle cx="153" cy="199" r="21"/><circle cx="207" cy="190" r="18"/><circle cx="249" cy="192" r="17"/>
  </g>
  <path class="flow" d="M176 74c-15 22 8 35-5 56s13 34 1 54 8 34 3 58"/>
  <text class="small" x="175" y="282">connected pores carry flow</text>

  <rect class="panel" x="360" y="10" width="330" height="300" rx="18"/>
  <text class="label" x="525" y="50">Network connectivity</text>
  <g class="link">
    <path d="M410 126L475 89 535 129 613 92M410 126l35 82 90-79 67 83M445 208l90 31 67-27M535 129l0 110"/>
  </g>
  <g class="node">
    <circle cx="410" cy="126" r="15"/><circle cx="475" cy="89" r="15"/><circle cx="535" cy="129" r="15"/><circle cx="613" cy="92" r="15"/><circle cx="445" cy="208" r="15"/><circle cx="535" cy="239" r="15"/><circle cx="602" cy="212" r="15"/>
  </g>
  <path d="M535 129l67 83" stroke="#df5a36" stroke-width="9" stroke-dasharray="12 10"/>
  <text class="small" x="525" y="282">failures can disconnect a system</text>

  <rect class="panel" x="710" y="10" width="330" height="300" rx="18"/>
  <text class="label" x="875" y="50">Epidemic reach</text>
  <g stroke="#9baac1" stroke-width="4">
    <path d="M760 108l75 27 71-47 80 39M760 108l42 89 33-62 55 79 16-126M802 197l88 17 74-14 22-73"/>
  </g>
  <g class="node">
    <circle cx="760" cy="108" r="17"/><circle cx="835" cy="135" r="17"/><circle cx="906" cy="88" r="17"/><circle cx="986" cy="127" r="17"/><circle cx="802" cy="197" r="17"/><circle cx="890" cy="214" r="17"/><circle cx="964" cy="200" r="17"/>
  </g>
  <g class="active">
    <circle cx="760" cy="108" r="15"/><circle cx="835" cy="135" r="15"/><circle cx="906" cy="88" r="15"/><circle cx="802" cy="197" r="15"/><circle cx="890" cy="214" r="15"/>
  </g>
  <text class="small" x="875" y="282">contact paths determine spread</text>

  <rect class="panel" x="1060" y="10" width="330" height="300" rx="18"/>
  <text class="label" x="1225" y="50">Fire spread</text>
  <g>
    <path class="tree" d="M1112 211v-48M1167 211v-63M1223 211v-48M1279 211v-66M1334 211v-51"/>
    <circle class="crown" cx="1112" cy="142" r="28"/><circle class="crown" cx="1167" cy="123" r="31"/><circle class="crown" cx="1223" cy="141" r="28"/><circle class="crown" cx="1279" cy="119" r="31"/><circle class="crown" cx="1334" cy="139" r="28"/>
    <path class="flame" d="M1090 211c-8-29 19-38 13-70 28 23 39 46 19 70z"/>
    <path class="flame2" d="M1101 211c-3-15 10-24 9-38 13 14 18 27 8 38z"/>
    <path class="flame" d="M1144 211c-7-25 15-35 13-59 24 20 31 39 17 59z" opacity=".78"/>
  </g>
  <text class="small" x="1225" y="282">connected fuel permits propagation</text>
</svg>
