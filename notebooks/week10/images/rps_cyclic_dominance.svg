<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Rock, paper and scissors cyclic dominance</title>
  <desc id="desc">Paper wraps rock, rock smashes scissors, and scissors cuts paper. Arrows point from each winning action to the action it defeats.</desc>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L16 8 L0 16 Z" fill="#1B2A4C"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1B2A4C" flood-opacity="0.14"/>
    </filter>
    <style>
      .explanation { font: 600 18px Baskerville, Georgia, serif; fill: #1B2A4C; text-anchor: middle; }
      .node-label { font: 600 18px Baskerville, Georgia, serif; fill: #1B2A4C; text-anchor: middle; }
      .rule { fill: none; stroke: #1B2A4C; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="720" height="460" fill="#FFFFFF"/>

  <!-- Arrows are drawn first, with a small gap before each target circle. -->
  <path class="rule" d="M480 130 C425 68 295 68 240 130"/>
  <path class="rule" d="M145 212 C145 275 220 315 305 300"/>
  <path class="rule" d="M415 300 C500 315 575 275 575 212"/>

  <!-- Explanatory labels sit in open space away from the arrows and nodes. -->
  <text class="explanation" x="360" y="34">paper wraps rock</text>
  <text class="explanation" x="72" y="326">rock smashes</text>
  <text class="explanation" x="72" y="349">scissors</text>
  <text class="explanation" x="648" y="326">scissors cuts</text>
  <text class="explanation" x="648" y="349">paper</text>

  <g filter="url(#shadow)">
    <circle cx="180" cy="165" r="60" fill="#B07A00"/>
    <circle cx="540" cy="165" r="60" fill="#0072B2"/>
    <circle cx="360" cy="345" r="60" fill="#009E73"/>
  </g>

  <!-- Smaller, centred icons. -->
  <g transform="translate(180 165) scale(0.62)">
    <path d="M-42 25 L-55 -5 L-39 -39 L-8 -52 L34 -43 L52 -9 L42 28 L10 46 L-28 40 Z" fill="#1B2A4C"/>
    <path d="M-31 -28 L-7 -40 L16 -32 L2 -14 L-23 -10 Z" fill="#526582"/>
  </g>

  <g transform="translate(540 165) scale(0.70)" fill="#FFFFFF" stroke="#1B2A4C" stroke-width="5" stroke-linejoin="round">
    <path d="M-34 -44 H15 L37 -22 V44 H-34 Z"/>
    <path d="M15 -44 V-22 H37" fill="#DDE8F8"/>
    <path d="M-18 3 H20 M-18 22 H20" fill="none" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(360 345) scale(0.62)" fill="none" stroke="#1B2A4C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-8 -3 L-43 -39 L-62 -61"/>
    <path d="M8 -3 L43 -39 L62 -61"/>
    <path d="M-7 5 L-39 39"/>
    <path d="M7 5 L39 39"/>
    <circle cx="-30" cy="42" r="17" fill="#009E73"/>
    <circle cx="30" cy="42" r="17" fill="#009E73"/>
    <circle cx="0" cy="0" r="7" fill="#1B2A4C" stroke="none"/>
  </g>

  <!-- Node names are outside the arrows. -->
  <text class="node-label" x="79" y="171">rock</text>
  <text class="node-label" x="641" y="171">paper</text>
  <text class="node-label" x="360" y="433">scissors</text>
</svg>
