<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="title desc">
  <title id="title">Replicator dynamics in the Prisoner’s Dilemma</title>
  <desc id="desc">In a well-mixed Prisoner’s Dilemma population, the share of cooperation falls and the share of defection rises. Different initial mixtures all move toward defection.</desc>
  <style>
    .title{font:18px "DejaVu Sans",sans-serif;font-weight:400;fill:#1B2A4C;text-anchor:middle}.axis{stroke:#6A7691;stroke-width:1.5}.grid{stroke:#D7DDE7;stroke-width:1}.label{font:13px "DejaVu Sans",sans-serif;fill:#4C5975}.legend{font:13px "DejaVu Sans",sans-serif;fill:#5A6685}.cooperate{fill:none;stroke:#D55E00;stroke-width:4}.defect{fill:none;stroke:#0072B2;stroke-width:4;stroke-dasharray:8 6}.low{fill:none;stroke:#B07A00;stroke-width:3}.mid{fill:none;stroke:#D55E00;stroke-width:3}.high{fill:none;stroke:#0072B2;stroke-width:3}
  </style>
  <rect width="980" height="430" fill="#FFFFFF"/>
  <text class="title" x="255" y="30">Population mix from x₀ = 0.50</text>
  <text class="title" x="735" y="30">Different starting mixtures</text>
  <line class="cooperate" x1="105" y1="58" x2="133" y2="58"/><text class="legend" x="142" y="63">cooperate</text>
  <line class="defect" x1="270" y1="58" x2="298" y2="58"/><text class="legend" x="307" y="63">defect</text>
  <line class="low" x1="575" y1="58" x2="603" y2="58"/><text class="legend" x="612" y="63">x₀ = 0.20</text>
  <line class="mid" x1="700" y1="58" x2="728" y2="58"/><text class="legend" x="737" y="63">x₀ = 0.50</text>
  <line class="high" x1="825" y1="58" x2="853" y2="58"/><text class="legend" x="862" y="63">x₀ = 0.80</text>
