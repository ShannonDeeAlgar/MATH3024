<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" role="img" aria-labelledby="title desc">
<title id="title">Yeast cooperation: shared sugars</title>
<desc id="desc">A producer pays the cost of making invertase. The released sugars can benefit both producers and non-producers. Schematic, not experimental data.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5A6685" stroke-width="1.5"/></marker></defs>
<rect x="8" y="8" width="504" height="334" rx="22" fill="#F5F7FA"/>
<g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" fill="#1B2A4C">
<ellipse cx="115" cy="118" rx="43" ry="53" transform="rotate(-18 115 118)" fill="#D8EAF4" stroke="#2C7FB8" stroke-width="4"/>
<ellipse cx="155" cy="79" rx="18" ry="22" fill="#D8EAF4" stroke="#2C7FB8" stroke-width="3"/>
<circle cx="114" cy="116" r="12" fill="#2C7FB8" opacity=".55"/>
<ellipse cx="407" cy="118" rx="43" ry="53" transform="rotate(18 407 118)" fill="#FAE4DD" stroke="#D95F3B" stroke-width="4"/>
<ellipse cx="444" cy="76" rx="17" ry="21" fill="#FAE4DD" stroke="#D95F3B" stroke-width="3"/>
<circle cx="407" cy="116" r="12" fill="#D95F3B" opacity=".55"/>
<text x="115" y="207" font-size="23">Producer</text>
<text x="407" y="207" font-size="23">Non-producer</text>
<text x="115" y="235" font-size="17" fill="#5A6685">pays enzyme cost</text>
<text x="407" y="235" font-size="17" fill="#5A6685">avoids enzyme cost</text>
<g fill="#F4C542" stroke="#B89228" stroke-width="1.5">
<circle cx="247" cy="92" r="8"/><circle cx="274" cy="106" r="8"/><circle cx="251" cy="127" r="8"/>
<circle cx="280" cy="140" r="8"/><circle cx="236" cy="153" r="8"/>
</g>
<path d="M226 110 L179 110" fill="none" stroke="#5A6685" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M293 110 L345 110" fill="none" stroke="#5A6685" stroke-width="3" marker-end="url(#arrow)"/>
<text x="260" y="40" font-size="20">Released sugars</text>
<path d="M149 62 Q195 18 234 66" fill="none" stroke="#2C7FB8" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="260" y="294" font-size="21">A shared benefit, an unequal cost</text>
<text x="260" y="323" font-size="16" fill="#5A6685">Conceptual schematic</text>
</g></svg>
